version: '3.8'

services:
  backend:
    build: ./backend
    container_name: sentinel_backend
    restart: always
    ports:
      - "8000:8000"
    volumes:
      - ./backend/data:/app/data
    environment:
      - DATABASE_URL=sqlite:///./data/sentinel_tip.db

  frontend:
    build: ./frontend
    container_name: sentinel_frontend
    restart: always
    ports:
      - "80:80"
    depends_on:
      - backend